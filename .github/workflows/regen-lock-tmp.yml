name: regen-lock-tmp
# Temporary: regenerates app/gradle.lockfile on a runner. Removed before merge.
on:
  push:
    branches: [ccr-231c9bdf-1gd51c]
permissions:
  contents: write
jobs:
  regen:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - run: ./gradlew :app:dependencies --write-locks --no-daemon > /dev/null
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/gradle.lockfile
          git diff --cached --quiet && echo "lockfile unchanged" && exit 0
          git commit -m "build: regenerate app/gradle.lockfile with guava 33.7.2"
          git push origin HEAD:ccr-231c9bdf-1gd51c
